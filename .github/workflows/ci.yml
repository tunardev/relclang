name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test --summary all

      - name: Compiler cases
        run: zig build cases --summary all

      - name: Examples
        run: |
          for f in examples/*.rls; do
            echo "--- $f"
            ./zig-out/bin/relc run "$f"
          done
