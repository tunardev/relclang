name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: zig-toolchain
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.target }}

      - name: Download Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          set -eux
          name="zig-${{ matrix.target }}-${{ env.ZIG_VERSION }}"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://ziglang.org/download/${{ env.ZIG_VERSION }}/${name}.tar.xz" -o zig.tar.xz
          mkdir -p zig-toolchain
          tar -xJf zig.tar.xz -C zig-toolchain --strip-components=1

      - name: Add Zig to PATH
        run: echo "$GITHUB_WORKSPACE/zig-toolchain" >> "$GITHUB_PATH"

      - name: Version
        run: zig version

      - name: Format
        run: zig fmt --check src tests build.zig

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test --summary all

      - name: Compiler cases
        run: zig build cases --summary all

      - name: Examples
        run: |
          set -eu
          for f in examples/*.rls; do
            echo "--- $f"
            ./zig-out/bin/relc run "$f"
          done
